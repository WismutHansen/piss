name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run pytest
      - name: Parse and run every example
        run: |
          for f in examples/*.piss; do
            uv run piss check "$f"
            if [ "$f" = "examples/evaporate.piss" ]; then
              uv run piss run "$f" --decay 100
            else
              uv run piss run "$f" > /dev/null
            fi
          done
